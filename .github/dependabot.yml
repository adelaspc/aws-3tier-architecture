version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/deployment-notes"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    groups:
      python-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/deployment-notes/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    groups:
      frontend-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      frontend-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/deployment-notes"
      - "/deployment-notes/backend"
      - "/deployment-notes/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    groups:
      container-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      container-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/environments/backend-bootstrap"
      - "/environments/dev"
      - "/environments/github-actions-bootstrap"
      - "/environments/modules/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    groups:
      terraform-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      terraform-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    groups:
      actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
