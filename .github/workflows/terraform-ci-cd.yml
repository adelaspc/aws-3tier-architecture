name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/**"
      - ".github/workflows/terraform-ci-cd.yml"
      - ".terraform-docs.yml"
      - ".terraform-version"
      - ".tflint.hcl"
      - "scripts/validate-iam-policies.sh"
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - ".github/workflows/terraform-ci-cd.yml"
      - ".terraform-docs.yml"
      - ".terraform-version"
      - ".tflint.hcl"
      - "scripts/validate-iam-policies.sh"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run against the dev environment
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  TF_WORKING_DIR: environments/dev
  TERRAFORM_DOCS_VERSION: v0.24.0
  TFLINT_VERSION: v0.60.0

jobs:
  quality:
    name: Format, test, and scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive environments

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      - name: Check generated Terraform docs
        run: |
          for module_dir in environments/modules/*; do
            [ -d "$module_dir" ] || continue
            terraform-docs --config .terraform-docs.yml "$module_dir"
          done

          terraform-docs --config .terraform-docs.yml environments/dev
          git diff --exit-code -- environments/modules environments/dev

      - name: Initialize GitHub Actions IAM test module
        working-directory: environments/modules/github-actions-iam
        run: terraform init -backend=false -input=false

      - name: Test GitHub Actions IAM authorization boundaries
        working-directory: environments/modules/github-actions-iam
        run: terraform test -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@c750028ac0f3831886a261f96da68ab58a92e7ec # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Initialize TFLint plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run TFLint
        working-directory: environments
        run: tflint --recursive --format compact --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@5659ddea96102e16d8f221b3d8402453c0b1c150 # v12
        with:
          directory: environments
          framework: terraform
          quiet: true
          compact: true
          output_format: cli
          soft_fail: false

  validate:
    name: Validate ${{ matrix.configuration.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - name: backend bootstrap
            working-directory: environments/backend-bootstrap
          - name: dev
            working-directory: environments/dev
          - name: GitHub Actions IAM bootstrap
            working-directory: environments/github-actions-bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-

      - name: Initialize Terraform
        working-directory: ${{ matrix.configuration.working-directory }}
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: ${{ matrix.configuration.working-directory }}
        run: terraform validate -no-color

  plan:
    name: Plan dev
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'plan')
    needs:
      - quality
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_TERRAFORM_PLAN_ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Validate CI configuration
        run: |
          : "${AWS_REGION:?Repository variable AWS_REGION is required}"
          : "${AWS_TERRAFORM_PLAN_ROLE_ARN:?Repository variable AWS_TERRAFORM_PLAN_ROLE_ARN is required}"
          : "${TF_STATE_BUCKET:?Repository variable TF_STATE_BUCKET is required}"
          : "${TF_STATE_KEY:?Repository variable TF_STATE_KEY is required}"
          : "${TF_VARS_JSON:?Repository secret TF_VARS_JSON is required}"
          : "${CLOUDFLARE_API_TOKEN:?Repository secret CLOUDFLARE_API_TOKEN is required}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate IAM policies with AWS Access Analyzer
        run: |
          validation_dir="environments/.github-actions-bootstrap-validation"
          mkdir -p "$validation_dir"
          find environments/github-actions-bootstrap -maxdepth 1 -type f \
            \( -name '*.tf' -o -name '.terraform.lock.hcl' \) \
            ! -name 'backend.tf' \
            -exec cp {} "$validation_dir"/ \;

          terraform -chdir="$validation_dir" init -backend=false -input=false
          terraform -chdir="$validation_dir" plan \
            -refresh=false \
            -lock=false \
            -input=false \
            -out=iam-validation.tfplan \
            -var="project=$(jq -r '.project' <<< "$TF_VARS_JSON")" \
            -var="environment=$(jq -r '.environment' <<< "$TF_VARS_JSON")" \
            -var="region=$AWS_REGION" \
            -var="state_bucket_name=$TF_STATE_BUCKET" \
            -var="dev_state_key=$TF_STATE_KEY"
          ./scripts/validate-iam-policies.sh "$validation_dir/iam-validation.tfplan"

      - name: Create backend and variable files
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          printf 'bucket = "%s"\nkey = "%s"\nregion = "%s"\nencrypt = true\nuse_lockfile = true\n' \
            "$TF_STATE_BUCKET" "$TF_STATE_KEY" "$AWS_REGION" > backend.hcl
          printf '%s' "$TF_VARS_JSON" > terraform.auto.tfvars.json
          chmod 600 backend.hcl terraform.auto.tfvars.json
          jq -e . terraform.auto.tfvars.json > /dev/null

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -reconfigure -backend-config=backend.hcl

      - name: Create Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > terraform-plan.txt

      - name: Add plan to job summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          plan_summary="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\. Your infrastructure matches the configuration\.)$' terraform-plan.txt | tail -n 1 || true)"
          : "${plan_summary:=Plan completed; aggregate change counts were not available.}"

          {
            echo "## Terraform dev plan"
            echo
            echo "- Result: successful"
            echo "- Summary: ${plan_summary}"
            echo "- Detailed plan: retained as a workflow artifact for 7 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: environments/dev/terraform-plan.txt
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Apply dev
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      github.ref == 'refs/heads/main'
    needs:
      - quality
      - validate
    runs-on: ubuntu-latest
    environment: terraform-dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_TERRAFORM_APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Validate CI configuration
        run: |
          : "${AWS_REGION:?Repository variable AWS_REGION is required}"
          : "${AWS_TERRAFORM_APPLY_ROLE_ARN:?Repository variable AWS_TERRAFORM_APPLY_ROLE_ARN is required}"
          : "${TF_STATE_BUCKET:?Repository variable TF_STATE_BUCKET is required}"
          : "${TF_STATE_KEY:?Repository variable TF_STATE_KEY is required}"
          : "${TF_VARS_JSON:?Repository secret TF_VARS_JSON is required}"
          : "${CLOUDFLARE_API_TOKEN:?Repository secret CLOUDFLARE_API_TOKEN is required}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environments/**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-providers-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate IAM policies with AWS Access Analyzer
        run: |
          validation_dir="environments/.github-actions-bootstrap-validation"
          mkdir -p "$validation_dir"
          find environments/github-actions-bootstrap -maxdepth 1 -type f \
            \( -name '*.tf' -o -name '.terraform.lock.hcl' \) \
            ! -name 'backend.tf' \
            -exec cp {} "$validation_dir"/ \;

          terraform -chdir="$validation_dir" init -backend=false -input=false
          terraform -chdir="$validation_dir" plan \
            -refresh=false \
            -lock=false \
            -input=false \
            -out=iam-validation.tfplan \
            -var="project=$(jq -r '.project' <<< "$TF_VARS_JSON")" \
            -var="environment=$(jq -r '.environment' <<< "$TF_VARS_JSON")" \
            -var="region=$AWS_REGION" \
            -var="state_bucket_name=$TF_STATE_BUCKET" \
            -var="dev_state_key=$TF_STATE_KEY"
          ./scripts/validate-iam-policies.sh "$validation_dir/iam-validation.tfplan"

      - name: Create backend and variable files
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          printf 'bucket = "%s"\nkey = "%s"\nregion = "%s"\nencrypt = true\nuse_lockfile = true\n' \
            "$TF_STATE_BUCKET" "$TF_STATE_KEY" "$AWS_REGION" > backend.hcl
          printf '%s' "$TF_VARS_JSON" > terraform.auto.tfvars.json
          chmod 600 backend.hcl terraform.auto.tfvars.json
          jq -e . terraform.auto.tfvars.json > /dev/null

      - name: Initialize Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -reconfigure -backend-config=backend.hcl

      - name: Plan Terraform changes
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > terraform-plan.txt

      - name: Add plan to job summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          plan_summary="$(grep -E '^(Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.|No changes\. Your infrastructure matches the configuration\.)$' terraform-plan.txt | tail -n 1 || true)"
          : "${plan_summary:=Plan completed; aggregate change counts were not available.}"

          {
            echo "## Terraform dev apply plan"
            echo
            echo "- Result: successful"
            echo "- Summary: ${plan_summary}"
            echo "- Detailed plan: retained as a workflow artifact for 7 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply plan output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: terraform-dev-apply-plan-${{ github.run_id }}
          path: environments/dev/terraform-plan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Apply Terraform changes
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -no-color -input=false -lock-timeout=5m -auto-approve tfplan
